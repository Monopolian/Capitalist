function credit(to,a){if(to==='pot'){if(HR.fp)G.fp+=a;return}const t=Array.isArray(to)?to:to?[to]:[];t.forEach(q=>q.cash+=a/t.length)}
function charge(p,a,to,msg,then){
 if(a<=0){then&&then();return}
 if(p.cash>=a){p.cash-=a;credit(to,a);say(`${p.n} ${msg}.`);then&&then()}
 else if(assets(p)>=a){G.debt={a,to,msg,then};G.phase='debt';say(`${p.n} owes $${a} - must raise cash.`)}
 else bankrupt(p,to)}

function bankrupt(p,to){if(Array.isArray(to)||to==='pot')to=null;say(`${p.n} is bankrupt!`);fxEv('bank',{p,to});p.out=true;G.debt=null;
 prop(p).forEach(i=>{const h=G.h[i]||0;if(h==5)G.ht++;else G.hs+=h;delete G.h[i];if(to){G.own[i]=to.i;if(G.mort[i])to.cash-=Math.min(Math.ceil(S[i].p*.05),to.cash)}else{delete G.own[i];delete G.mort[i]}});
 if(to)to.cash+=p.cash;p.gf.forEach(k=>{if(to)to.gf.push(k);else G.gfh[k]=0});p.cash=0;p.gf=[];G.phase='end';
 const al=G.pl.filter(q=>!q.out);if(al.length==1){G.win=al[0].i;say(' '+al[0].n+' wins!');fxEv('win',{p:al[0]})}}
function buy(){const p=me(),s=S[p.pos];if(p.cash<s.p)return;p.cash-=s.p;G.own[p.pos]=G.cur;say(`${p.n} buys ${s.n} for $${s.p}.`);G.phase='end';render()}
function skip(){say(`${me().n} declines to buy ${S[me().pos].n} ($${S[me().pos].p}).`);if(!HR.auction){G.phase='end';return render()}

function fin(){const a=G.auc;if(a.hi!=null){const w=G.pl[a.hi];w.cash-=a.bid;G.own[a.i]=a.hi;say(`${w.n} wins ${S[a.i].n} for $${a.bid}.`)}else say('No bids. It stays with the bank.');G.auc=null;G.phase='end'}
function rollAgain(){if(!G||G.win!=null||G.phase!='end')return;G.mvTxt='';G.phase='roll';roll()}
function buildSummary(p){const bl=G.bl||{};G.bl={};Object.keys(bl).forEach(i=>{const r=bl[i];if(G.own[i]!==p.i)return;const hs=Math.max(0,r.h-(r.t?4:0)),parts=[];if(hs>0)parts.push(hs+(hs>1?' houses':' house'));if(r.t>0)parts.push(r.t>1?r.t+' hotels':'a hotel');if(parts.length)say(`${p.n} built ${parts.join(' and ')} on ${S[i].n}.`)})}

 if(!(G.again&&!p.jail&&!p.out)){buildSummary(p);do{G.cur=(G.cur+1)%G.pl.length}while(G.pl[G.cur].out);G.dbl=0;say(`${G.pl[G.cur].n}'s turn.`)}
